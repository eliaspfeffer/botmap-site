name: Check TestFlight availability
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
concurrency:
  group: testflight-availability
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check_testflight.py
        env:
          GH_TOKEN: ${{ github.token }}
          BOTMAP_TESTFLIGHT_INVITE: ${{ vars.BOTMAP_TESTFLIGHT_INVITE }}
