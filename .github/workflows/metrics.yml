name: Record Botmap metrics
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
concurrency:
  group: botmap-metrics-history
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 .github/scripts/record-metrics.py
        env:
          GH_TOKEN: ${{ github.token }}
