name: Linux terminal installer
on:
  push:
    paths:
      - install-linux.sh
      - .github/workflows/linux-installer.yml
  pull_request:
    paths:
      - install-linux.sh
      - .github/workflows/linux-installer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-open:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y xauth xvfb x11-utils
      - name: Run the installer and check the desktop window
        run: |
          xvfb-run -a bash -euo pipefail -c '
            cat install-linux.sh | bash
            dpkg-query -W -f="\${Architecture}\n" botmap | grep -Fx "$(dpkg --print-architecture)"
            for attempt in $(seq 1 30); do
              if xwininfo -root -tree | grep -F "\"Botmap\"" >/dev/null; then exit 0; fi
              sleep 1
            done
            cat "$HOME/.local/state/botmap/install-launch.log"
            exit 1
          '
